log_level: info
max_steps: 100000
fp16: true
learning_rate: 0.00002
weight_decay: 0.01
lr_scheduler_type: linear
warmup_steps: 6000
save_strategy: steps
save_steps: 100000
dataloader_drop_last: true
max_grad_norm: null